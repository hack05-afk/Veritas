# Query service. Any host that can run a Dockerfile will do; this is the
# free tier shape for Render.
services:
  - type: web
    name: veritas-query
    env: docker
    dockerfilePath: ./services/query/Dockerfile
    dockerContext: ./services/query
    healthCheckPath: /health
    disk:
      name: ledger
      mountPath: /srv/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /srv/data
      - key: DUCKDB_MEMORY_LIMIT
        value: 1GB
