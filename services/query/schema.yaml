# Logical name to physical column map. Swapping in the real dataset means
# editing this file and rerunning the loader; no other file changes.
bank:
  table: bank
  columns:
    bank_code: bank_code
    bank_name: bank_name

account:
  table: account
  columns:
    account_id: account_id
    entity_id: entity_id
    account_number: account_number
    program_id: program_id
    available_balance: available_balance
    bank_code: bank_code

transaction:
  table: transaction
  columns:
    transaction_id: transaction_id
    account_id: account_id
    transaction_date: transaction_date
    transaction_type: transaction_type
    description: description
    transaction_amount: transaction_amount
    transaction_reference_id: transaction_reference_id
    utr_number: utr_number

# Columns that are masked in every response, table, export and spoken sentence.
sensitive:
  - account.account_number
  - transaction.utr_number
